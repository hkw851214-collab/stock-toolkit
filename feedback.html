<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의 · 버그 제보 | 스마트 투자 툴킷</title>
  <meta name="description" content="스마트 투자 툴킷의 버그 제보, 계산 오류 신고, 신규 기능 제안을 남길 수 있는 1:1 비공개 문의 페이지입니다." />
  <link rel="stylesheet" href="/css/common.css?v=2.0" />
  <style>
    .fb-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .field label { font-size: 0.96rem; font-weight: 700; color: #cbd5e1; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 13px 15px;
      background: #0f172a;
      color: #f8fafc;
      border: 1.5px solid #334155;
      border-radius: 10px;
      font-size: 1.04rem;
      font-family: inherit;
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #38bdf8; }
    .field textarea { min-height: 160px; resize: vertical; line-height: 1.6; }
    .hp-field { display: none !important; }
    .submit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    @media (max-width: 640px) {
      .fb-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="feedback" data-disclaimer="false">
  <div id="site-nav"></div>

  <main class="wrap">
    <header class="page-header">
      <h1>문의 · 버그 제보</h1>
      <p>버그 신고나 추가했으면 하는 계산기 아이디어를 남겨주시면 비공개로 운영자에게 전달됩니다.</p>
    </header>

    <section class="card">
      <form id="feedbackForm">
        <div class="fb-grid">
          <div class="field" style="margin-bottom: 0;">
            <label for="fbType">문의 유형</label>
            <select id="fbType">
              <option value="버그 제보">🐛 버그 / 오류 제보</option>
              <option value="기능 추가 제안">💡 신규 기능 / 계산기 제안</option>
              <option value="계산 수식 문의">📊 계산 결과 / 세율 문의</option>
              <option value="기타 문의">✉️ 기타 문의</option>
            </select>
          </div>
          <div class="field" style="margin-bottom: 0;">
            <label for="fbPage">관련 메뉴</label>
            <select id="fbPage">
              <option value="주가 시뮬레이터">주가 시뮬레이터</option>
              <option value="배당·복리 계산기">배당·복리 계산기</option>
              <option value="절세·양도세 계산기">절세·양도세 계산기</option>
              <option value="물타기 계산기">물타기 계산기</option>
              <option value="사이트 전체 / 기타">사이트 전체 / 기타</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="fbMessage">내용 (필수)</label>
          <textarea id="fbMessage" required minlength="5" maxlength="1500" placeholder="오류가 발생한 종목명이나 상황, 또는 추가를 원하시는 기능을 편하게 적어주세요."></textarea>
        </div>

        <div class="field">
          <label for="fbEmail">회신받을 이메일 (선택)</label>
          <input id="fbEmail" type="email" placeholder="답변이 필요하신 경우에만 입력해 주세요." />
        </div>

        <!-- 스팸 봇 차단용 숨김 필드 -->
        <input id="fbWebsite" class="hp-field" type="text" tabindex="-1" autocomplete="off" />

        <div class="submit-row">
          <div id="fbStatus" class="status" style="margin-top: 0;"></div>
          <button id="fbSubmitBtn" class="btn-primary" type="submit">비공개 제보 전송</button>
        </div>
      </form>
    </section>

    <div id="site-footer"></div>
  </main>

  <script src="/js/layout.js?v=2.0"></script>
  <script>
    const form = document.getElementById('feedbackForm');
    const statusEl = document.getElementById('fbStatus');
    const submitBtn = document.getElementById('fbSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.className = 'status';
      statusEl.textContent = '⏳ 전송 중입니다...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: document.getElementById('fbType').value,
            page: document.getElementById('fbPage').value,
            message: document.getElementById('fbMessage').value,
            email: document.getElementById('fbEmail').value,
            website: document.getElementById('fbWebsite').value,
          }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || '전송에 실패했습니다.');
        }

        statusEl.textContent = '✅ 제보가 정상 접수되었습니다. 소중한 의견 감사합니다!';
        form.reset();
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = `❌ ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
